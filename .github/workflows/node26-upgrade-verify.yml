name: Verify Node 26 LTS upgrade

on:
  push:
    branches: ['chore/node26-lts-20261105']

permissions:
  contents: write

jobs:
  node26:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Check patched Node.js version
        run: node -e "const [major, minor, patch] = process.versions.node.split('.').map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) { console.error('Node.js >=26.12.1 <27 required, found ' + process.versions.node); process.exit(1); }"
      - name: Regenerate and commit lockfile
        run: |
          set -euo pipefail
          bun install
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bun.lock
            git commit -m 'chore: update Bun lockfile for Node 26 typings'
            git push origin HEAD:chore/node26-lts-20261105
          fi
      - name: Frozen lockfile check
        run: bun install --frozen-lockfile
      - name: High severity production dependency audit
        run: bun audit --prod --audit-level=high
      - name: Unit tests
        run: bun test
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
