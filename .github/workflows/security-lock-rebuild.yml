name: Patch Bun dependencies (temporary)
on:
  push:
    branches:
      - security/harden-wallet-operations-20261105
    paths:
      - .github/workflows/security-lock-rebuild.yml
permissions:
  contents: read
jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Resolve and update dependency graph
        run: |
          bun install --frozen-lockfile
          bun update
          bun audit --prod --audit-level=high || true
          bun audit --prod --audit-level=high || true
      - name: Emit updated package manifests
        run: |
          echo "PKG_DUMP_BEGIN"
          sed 's/^/PKG_DATA:/' package.json
          echo "PKG_DUMP_END"
          echo "LOCK_DUMP_BEGIN"
          sed 's/^/LOCK_DATA:/' bun.lock
          echo "LOCK_DUMP_END"
