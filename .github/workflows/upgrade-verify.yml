name: Verify Node 24 and framework upgrades

on:
  push:
    branches: ['chore/upgrade-node24-toolchain-20261105']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Regenerate and commit Bun lockfile if changed
        run: |
          set -euo pipefail
          node --version
          bun install
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bun.lock
            git commit -m 'chore: regenerate Bun lockfile for upgraded toolchain'
            git push origin HEAD:chore/upgrade-node24-toolchain-20261105
          fi
      - name: Audit production dependencies
        run: bun audit --prod --audit-level=high
      - name: Run unit tests
        run: bun test
      - name: Check TypeScript
        run: bunx tsc --noEmit
      - name: Lint upgraded sources
        run: bun run lint
      - name: Build static website
        run: bun run build
