name: One-time Node 26 branch cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-node26-branch-cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged Node 26 upgrade branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='chore/node26-lts-20261105'
          status=$(curl -sS -o /tmp/delete-response -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}")
          if [ "$status" = "204" ] || [ "$status" = "404" ]; then
            echo "Cleanup successful (HTTP $status)"
          elif [ "$status" = "422" ]; then
            echo "GitHub reports reference absent (HTTP $status)"
            cat /tmp/delete-response
          else
            echo "Failed to delete branch (HTTP $status)"
            cat /tmp/delete-response
            exit 1
          fi
