name: CI

on:
  push:
    branches:
      - main
      - security/harden-wallet-operations-20261105
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit high-severity production dependency advisories
        run: bun audit --prod --audit-level=high

      - name: Run unit tests
        run: bun test

      - name: Check TypeScript
        run: bunx tsc --noEmit

      - name: Build static website
        run: bun run build
