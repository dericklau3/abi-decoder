name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Check Node runtime security baseline
        run: node -e "const [major, minor, patch] = process.versions.node.split('.').map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) { console.error('Node.js >=26.12.1 <27 required, found ' + process.versions.node); process.exit(1); }"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit high-severity production dependency advisories
        run: bun audit --prod --audit-level=high

      - name: Run unit tests
        run: bun test

      - name: Check TypeScript
        run: bunx tsc --noEmit

      - name: Lint upgraded sources
        run: bun run lint

      - name: Build static website
        run: bun run build
