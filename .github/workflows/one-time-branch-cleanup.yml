name: One-time reviewed branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-branch-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'dericklau3/abi-decoder'
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete or closed pull-request branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            'security/harden-wallet-operations-20261105'
            'dependabot/bun/eslint-config-next-16.4.3'
            'dependabot/bun/non-major-dependencies-e27bfc20f5'
            'dependabot/bun/tailwindcss-4.3.3'
            'dependabot/bun/types/node-26.6.6'
            'dependabot/bun/typescript-7.0.2'
            'dependabot/github_actions/actions/checkout-7'
            'dependabot/github_actions/actions/configure-pages-6'
            'dependabot/github_actions/actions/deploy-pages-5'
            'dependabot/github_actions/actions/setup-node-7'
            'dependabot/github_actions/actions/upload-pages-artifact-5'
          )
          for branch in "${branches[@]}"; do
            status=$(curl -sS -o /tmp/branch-delete-response -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}")
            if [ "$status" = "204" ]; then
              echo "Deleted $branch"
            elif [ "$status" = "404" ]; then
              echo "Already absent: $branch"
            else
              echo "Could not delete $branch (HTTP $status)"
              cat /tmp/branch-delete-response
              exit 1
            fi
          done
