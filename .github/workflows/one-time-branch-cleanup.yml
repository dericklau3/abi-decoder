name: One-time reviewed branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-branch-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'dericklau3/abi-decoder'
    runs-on: ubuntu-latest
    steps:
      - name: Remove remaining merged PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='dependabot/github_actions/actions/setup-node-7'
          status=$(curl -sS -o /tmp/branch-delete-response -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}")
          if [ "$status" = "204" ] || [ "$status" = "404" ] || [ "$status" = "422" ]; then
            echo "Cleanup request resolved for $branch (HTTP $status)"
          else
            echo "Could not delete $branch (HTTP $status)"
            cat /tmp/branch-delete-response
            exit 1
          fi
